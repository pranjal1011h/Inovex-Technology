<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Inovexa Technology</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>


<body class="login-page">

    <header class="site-header">

        <div class="header-container">

            <a href="index.html">
                <img class="logo"
                     src="logo.jpg"
                     alt="Inovexa Technology Logo">
            </a>

            <div class="company-name">
                <h1>Inovexa Technology</h1>
                <p>Building Careers. Inspiring Innovation.</p>
            </div>

        </div>

    </header>
    <main class="login-main">

        <section class="login-box">

            <p class="login-label">
                INOVEXA TECHNOLOGY
            </p>

            <h2>Welcome Back</h2>

            <p class="login-description">
                Login to explore careers and innovation opportunities.
            </p>
            <form id="loginForm" action="#" method="post">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember-row">

                    <label class="remember-label">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

<p id="loginMessage"></p>
                <button type="submit" class="login-button">
                    Login
                </button>

            </form>


            <div class="register-section">

                <p>Don't have an account?</p>

                <a href="register.html" class="register-link">
                    Create an Account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>
    <footer class="simple-footer">

        <p>
            © 2026 Inovexa Technology. All Rights Reserved.
        </p>
    </footer>
</body>
</html>
