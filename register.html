
<div class="form-group">

    <label>
        Interested In
    </label>

    <label class="option-label">

        <input
            type="checkbox"
            id="innovation"
            name="innovation"
        >

        Innovation Program

    </label>


    <label class="option-label">

        <input
            type="checkbox"
            id="jobOpportunity"
            name="jobOpportunity"
        >

        Job Opportunity

    </label>

</div>



<div
    class="form-group"
    id="attendanceGroup"
    style="display: none;"
>

    <label>
        Will you attend the Job Drive?
    </label>

    <label class="option-label">

        <input
            type="radio"
            name="willAttend"
            value="yes"
        >

        Yes, I will attend

    </label>


    <label class="option-label">

        <input
            type="radio"
            name="willAttend"
            value="no"
        >

        No, I will not attend

    </label>

</div>
